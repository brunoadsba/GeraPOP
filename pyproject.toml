[project]
name = "gerapop"
version = "0.1.0"
description = "Gerador de POP (Procedimento Operacional Padrão) — CODEBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2,<2",
    "streamlit>=1.41.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.8.0,<1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gerapop*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["ideia-files", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
