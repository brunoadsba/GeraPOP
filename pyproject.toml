[project]
name = "gerapop"
version = "0.1.0"
description = "Gerador de POP (Procedimento Operacional Padrão) — CODEBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "python-docx>=1.1.2,<2",
    "reportlab>=5.0.0,<6",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.41.0,<2",
]
dev = [
    "pytest>=8.3.0,<9",
    "ruff>=0.8.0,<1",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gerapop*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"scripts/seed_pops.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
]
