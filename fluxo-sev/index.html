<!DOCTYPE html>
<html lang="pt-BR" data-fluxo="data/fluxo-desembarque.json" data-pops="data/pops">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEV — Fluxo Interativo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="cabecalho">
    <h1>SEV — Fluxo Operacional</h1>
    <p id="fluxo-titulo" class="subtitulo">Carregando fluxo…</p>
  </header>

  <main>
    <div id="erro" class="erro" hidden></div>
    <div id="diagrama" class="diagrama" aria-label="Diagrama do fluxo"></div>
  </main>

  <footer class="rodape">
    <p>Fonte: POPs gerados pelo GeraPOP · <span id="fluxo-id"></span></p>
  </footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-fechar></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <button class="modal-fechar" data-fechar type="button" aria-label="Fechar">&times;</button>
      <div id="modal-conteudo"></div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
