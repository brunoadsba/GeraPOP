app = "gerapop"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  GERAPOP_DATA_DIR = "/data"
  GERAPOP_LIBRARY_DIR = "/data/biblioteca"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "gerapop_data"
  destination = "/data"
